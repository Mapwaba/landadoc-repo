name: landadoc_common
description: What the LandaDoc Patient and Doctor apps share — server calls, sign-in, texts, models, widgets and the logo.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  cached_network_image: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The website's logo (LandaDoc.Frontend.Shared/wwwroot/landadoc-logo.png);
  # apps load it with Image.asset(..., package: 'landadoc_common')
  assets:
    - assets/landadoc-logo.png
