# Serves a standalone Blazor WebAssembly publish output.
#
# A plain static server (no ASP.NET Core host in front) never sends the
# "blazor-environment" header, so the WASM bootstrapper's HostEnvironment
# defaults to "Production" on its own — appsettings.Production.json is
# picked up automatically, no header needed here.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/wasm wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(dll|wasm|pdb|dat|blat)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
